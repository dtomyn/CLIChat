<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumen</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <script>
    // Apply theme before paint to avoid a flash.
    try { const t = localStorage.getItem('lumen-theme'); if (t && t !== 'system') document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="brand" data-nav="home" title="Home">
          <span class="brand-mark"><svg viewBox="0 0 32 32"><defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset=".55" stop-color="#c757d6"/><stop offset="1" stop-color="#ff8a5b"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#bg1)"/><path d="M16 6.5l2.2 6.3 6.3 2.2-6.3 2.2L16 23.5l-2.2-6.3L7.5 15l6.3-2.2z" fill="#fff"/></svg></span>
          <span class="brand-name">Lumen</span>
        </button>
        <button class="icon-btn collapse-btn" id="collapseBtn" title="Hide sidebar" data-icon="sidebar"></button>
      </div>

      <button class="new-chat" id="newChatBtn"><span data-icon="plus"></span>New chat <kbd>Ctrl K</kbd></button>

      <nav class="nav">
        <button class="nav-item" data-nav="assistants"><span data-icon="users"></span>Assistants</button>
        <button class="nav-item" data-nav="recipes"><span data-icon="wand"></span>Quick starts</button>
        <button class="nav-item" data-nav="runs"><span data-icon="list"></span>Lifecycle runs</button>
        <button class="nav-item" data-nav="insights"><span data-icon="chart"></span>Insights</button>
        <button class="nav-item" id="filesNavBtn"><span data-icon="folder"></span>Project folder</button>
      </nav>

      <div class="search-wrap">
        <span data-icon="search"></span>
        <input id="searchInput" placeholder="Search chats" autocomplete="off">
      </div>

      <div class="conv-list" id="convList"></div>

      <div class="sidebar-bottom">
        <button class="user-card" id="settingsBtn" title="Settings">
          <span class="avatar user-avatar" id="userAvatar">?</span>
          <span class="user-meta">
            <span class="user-name" id="userName">Welcome</span>
            <span class="engine-status" id="engineStatus"><i class="dot"></i><span>Checking…</span></span>
          </span>
          <span data-icon="settings" class="muted-icon"></span>
        </button>
      </div>
    </aside>

    <main class="main" id="main">
      <button class="icon-btn expand-btn" id="expandBtn" title="Show sidebar" data-icon="sidebar"></button>
      <div class="view" id="view"></div>
    </main>

    <aside class="drawer" id="filesDrawer" aria-hidden="true">
      <div class="drawer-head">
        <div>
          <div class="drawer-title">Project folder</div>
          <div class="drawer-sub" id="drawerPath"></div>
        </div>
        <button class="icon-btn" data-close-drawer data-icon="x"></button>
      </div>
      <div class="drawer-actions">
        <button class="btn soft sm" id="drawerOpenFolder"><span data-icon="external"></span>Open in Explorer</button>
        <button class="btn soft sm" id="drawerChangeFolder"><span data-icon="folder"></span>Change folder</button>
      </div>
      <div class="drawer-body" id="drawerFiles"></div>
    </aside>
  </div>

  <div class="modal-root" id="modalRoot"></div>
  <div class="toasts" id="toasts"></div>
  <div class="drop-overlay" id="dropOverlay"><div class="drop-card"><span data-icon="upload"></span><div>Drop files to attach</div><small>They'll be saved to your project folder</small></div></div>

  <script src="/vendor/marked.js"></script>
  <script src="/vendor/purify.js"></script>
  <script src="/vendor/hljs.js"></script>
  <script src="/app.js"></script>
</body>
</html>
